<!DOCTYPE html>
<html>
<head>

<title>Create Order</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>Create Order</h2>

<form method="POST">

    {% csrf_token %}

    <table class="table">

        <tr>

            <th>Product</th>

            <th>Quantity</th>

        </tr>

        {% for product in products %}

        <tr>

            <td>{{ product.name }}</td>

            <td>

                <input
                    type="number"
                    name="product_{{ product.id }}"
                    value="0"
                    min="0"
                    class="form-control"
                >

            </td>

        </tr>

        {% endfor %}

    </table>

    <button class="btn btn-primary">

        Create Order

    </button>

</form>

<br>

<a href="{% url 'home' %}">

Back to Home

</a>

</body>

</html>
